<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Person Room</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111827; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #score { position: absolute; top: 18px; left: 18px; padding: 12px 18px; background: #0f172acc; border-radius: 12px; }
    #hit { position: absolute; top: calc(50% + 24px); width: 100%; text-align: center; color: #fde047; }
    #fire { pointer-events: auto; touch-action: none; align-self: end; background: #fbbf24; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(135deg, rgba(15,23,42,.94), rgba(30,41,59,.88)); color: white; z-index: 10; }
    #panel { width: min(440px, calc(100% - 32px)); padding: 30px; border: 1px solid rgba(255,255,255,.18); border-radius: 22px; background: rgba(255,255,255,.08); text-align: center; backdrop-filter: blur(12px); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 7vw, 42px); }
    p { margin: 8px 0; color: #cbd5e1; line-height: 1.6; }
    button { margin-top: 18px; padding: 13px 28px; border: 0; border-radius: 999px; background: #60a5fa; color: #07111f; font-weight: 800; font-size: 16px; cursor: pointer; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: white; z-index: 5; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: white; border-radius: 2px; box-shadow: 0 0 3px #000; }
    #crosshair::before { width: 18px; height: 2px; top: 8px; }
    #crosshair::after { width: 2px; height: 18px; left: 8px; }
    #help { position: absolute; left: 16px; bottom: 16px; padding: 9px 12px; border-radius: 10px; background: rgba(15,23,42,.72); font-size: 13px; }
    #mobile { display: none; position: fixed; inset: auto 0 18px; padding: 0 18px; justify-content: space-between; z-index: 7; pointer-events: none; }
    .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 5px; pointer-events: auto; }
    .pad button { margin: 0; padding: 0; border-radius: 15px; background: rgba(15,23,42,.72); color: white; touch-action: none; }
    .up { grid-column: 2; } .left { grid-column: 1; grid-row: 2; } .down { grid-column: 2; grid-row: 2; } .right { grid-column: 3; grid-row: 2; }
    @media (pointer: coarse) { #mobile { display: flex; } #help { display: none; } }
  </style>
</head>
<body>
  <div id="overlay"><div id="panel"><h1>1인칭 방</h1><p>WASD로 이동하고 마우스로 둘러보세요.<br>Shift를 누르면 더 빠르게 움직입니다.</p><button id="start">게임 시작</button></div></div>
  <div id="hud"><div id="crosshair"></div><div id="help">WASD 이동 · 마우스 시점 · Shift 달리기 · ESC 일시정지</div></div>
  <div id="mobile"><div class="pad"><button class="up" data-key="KeyW">▲</button><button class="left" data-key="KeyA">◀</button><button class="down" data-key="KeyS">▼</button><button class="right" data-key="KeyD">▶</button></div></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94a3b8);
    scene.fog = new THREE.Fog(0x94a3b8, 15, 32);

    const PLAYER_EYE_HEIGHT = 1.7;
    const DUMMY_HEAD_CENTER = 2.1;
    const DUMMY_SCALE = PLAYER_EYE_HEIGHT / DUMMY_HEAD_CENTER;
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, PLAYER_EYE_HEIGHT, 5);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x334155, 1.7));
    const light = new THREE.DirectionalLight(0xffffff, 2.2);
    light.position.set(3, 7, 4); light.castShadow = true;
    light.shadow.mapSize.set(1024, 1024); scene.add(light);

    const roomSize = 18, roomHalf = roomSize / 2, wallHeight = 6, wallThickness = 0.45;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), new THREE.MeshStandardMaterial({ color: 0xd6c5a8, roughness: .86 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 1, side: THREE.DoubleSide }));
    ceiling.position.y = wallHeight; ceiling.rotation.x = Math.PI / 2; scene.add(ceiling);

    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xe7e5e4, roughness: .9 });
    function wall(x, z, width, depth) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, wallHeight, depth), wallMaterial);
      mesh.position.set(x, wallHeight / 2, z); mesh.receiveShadow = true; mesh.castShadow = true; scene.add(mesh);
    }
    wall(0, -roomHalf, roomSize, wallThickness); wall(0, roomHalf, roomSize, wallThickness);
    wall(-roomHalf, 0, wallThickness, roomSize); wall(roomHalf, 0, wallThickness, roomSize);

    const trimMaterial = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: .75 });
    for (const z of [-roomHalf + .3, roomHalf - .3]) wallTrim(0, .18, z, roomSize - .6, .36, .12);
    for (const x of [-roomHalf + .3, roomHalf - .3]) wallTrim(x, .18, 0, .12, .36, roomSize - .6);
    function wallTrim(x, y, z, w, h, d) { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), trimMaterial); m.position.set(x,y,z); scene.add(m); }

    // A few simple Roblox-like block props make movement and scale easier to read.
    const colors = [0x60a5fa, 0xfbbf24, 0xf87171, 0x34d399];
    [[-5,.75,-4,1.5],[4,1,-3,2],[-3,.5,3,1],[4.5,.65,3.5,1.3]].forEach(([x,y,z,s], i) => {
      const cube = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), new THREE.MeshStandardMaterial({ color: colors[i], roughness: .65 }));
      cube.position.set(x,y,z); cube.castShadow = true; cube.receiveShadow = true; scene.add(cube);
    });

    // Arcade blaster held in the first-person view; no external model assets.
    scene.add(camera);
    const blaster = new THREE.Group(); camera.add(blaster);
    blaster.position.set(.32, -.28, -.65);
    function block(parent, w, h, d, x, y, z, color) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color, roughness: .65}));
      mesh.position.set(x,y,z); parent.add(mesh); return mesh;
    }
    block(blaster,.22,.19,.48,0,0,0,0x38bdf8);
    block(blaster,.13,.13,.18,0,0,-.31,0xfbbf24);
    block(blaster,.12,.23,.14,0,-.17,.1,0x475569);
    block(blaster,.15,.14,.25,0,-.22,.22,0xfde68a);
    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.085,8,8), new THREE.MeshBasicMaterial({color:0xa5f3fc}));
    muzzle.position.z = -.43; blaster.add(muzzle); muzzle.visible = false;
    const dummies = [];
    [[-5,-6],[0,-6],[5,-6],[-6,0],[6,1]].forEach(([x,z],i) => {
      const group = new THREE.Group(); group.position.set(x,0,z);
      // Match the mannequin head center to the player's eye level; scale hitboxes too.
      group.scale.setScalar(DUMMY_SCALE); scene.add(group);
      const dummy = {group, hp:3, respawn:0, flash:0, parts:[]}; dummies.push(dummy);
      [[.65,.65,.55,0,2.1,0],[.85,.9,.45,0,1.3,0],[.25,.85,.35,-.59,1.3,0],[.25,.85,.35,.59,1.3,0],[.3,.8,.38,-.24,.4,0],[.3,.8,.38,.24,.4,0]].forEach((args, partIndex) => {
        const part = block(group,...args,colors[i%colors.length]); part.userData.dummy=dummy; part.userData.isHead=partIndex===0; part.castShadow=true; dummy.parts.push(part);
      });
      const badge = block(group,.38,.38,.03,0,1.4,.245,0xffffff); badge.userData.dummy=dummy;
      const bar = block(group,.95,.09,.06,0,2.65,0,0x34d399); dummy.bar=bar;
    });
    const hud = document.querySelector('#hud');
    const scoreLabel = document.createElement('div'); scoreLabel.id='score'; hud.append(scoreLabel);
    const hitLabel = document.createElement('div'); hitLabel.id='hit'; hud.append(hitLabel);
    const fireButton = document.createElement('button'); fireButton.id='fire'; fireButton.textContent='발사'; document.querySelector('#mobile').append(fireButton);
    document.querySelector('#help').textContent += ' · 좌클릭 누르기: 연속 발사';
    document.querySelector('#panel p').innerHTML += '<br>좌클릭 누르고 있기: 연속 발사 · 몸통 3회 · 헤드샷 1회 명중 시 점수 획득<br>모바일: 방향 버튼 이동 · 화면 드래그 · 발사 버튼 길게 누르기';
    const ray = new THREE.Raycaster();
    let shots=0, hits=0, score=0, lastShot=-1000, effectUntil=0;
    // Stylized arcade recoil offsets, independent of mouse/touch look input.
    let recoilPitch=0, recoilYaw=0, recoilHeat=0;
    function syncAim() {
      camera.rotation.set(Math.max(-1.48, Math.min(1.48, pitch+recoilPitch)), yaw+recoilYaw, 0);
    }
    function kickRecoil() {
      recoilHeat=Math.min(1, recoilHeat+.18);
      recoilPitch=Math.min(.24, recoilPitch+.025+.025*recoilHeat);
      recoilYaw=Math.max(-.055, Math.min(.055, recoilYaw+(Math.random()-.5)*(.018+.022*recoilHeat)));
      blaster.rotation.x=.12+.06*recoilHeat;
      blaster.rotation.z=(Math.random()-.5)*.06;
      syncAim();
    }
    function settleRecoil(dt, now) {
      const recovering=now-lastShot>240;
      const decay=Math.exp(-(recovering ? 7 : 1.2)*dt);
      recoilPitch*=decay; recoilYaw*=decay;
      if(recovering) recoilHeat=Math.max(0,recoilHeat-dt*1.5);
      blaster.rotation.x*=Math.exp(-14*dt);
      blaster.rotation.z*=Math.exp(-14*dt);
      syncAim();
    }
    const beams=[];
    function updateScore() { scoreLabel.textContent = `점수 ${score} · 명중 ${hits}/${shots}`; }
    updateScore();
    function playing() { return overlay.style.display==='none' && (isCoarse || document.pointerLockElement===renderer.domElement); }
    function shoot() {
      const now=performance.now(); if (!playing() || now-lastShot<180) return;
      lastShot=now; shots++; muzzle.visible=true; blaster.position.z=-.58;
      scene.updateMatrixWorld(true); ray.setFromCamera(new THREE.Vector2(0,0),camera);
      // Props and walls block shots; viewmodel and inactive targets are excluded.
      const objects=scene.children.filter(o=>o!==camera && o.visible && !o.isLine);
      const impact=ray.intersectObjects(objects,true)[0];
      const dummy=impact?.object.userData.dummy;
      if(dummy && dummy.hp>0) {
        const isHeadshot = impact.object.userData.isHead === true;
        hits++; dummy.hp=Math.max(0, dummy.hp-(isHeadshot ? 3 : 1)); dummy.flash=now+120; dummy.bar.scale.x=dummy.hp/3;
        hitLabel.textContent=isHeadshot ? '헤드샷! +100' : (dummy.hp ? '명중!' : '+100'); effectUntil=now+(isHeadshot ? 800 : 400);
        if(!dummy.hp) {score+=100; dummy.group.visible=false; dummy.respawn=now+2500;}
      }
      const origin=muzzle.getWorldPosition(new THREE.Vector3());
      const end=impact ? impact.point : ray.ray.at(30,new THREE.Vector3());
      const beam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([origin,end]),new THREE.LineBasicMaterial({color:0x67e8f9}));
      scene.add(beam); beams.push({beam,until:now+65}); updateScore();
      // Resolve this shot at the current crosshair before moving the next aim.
      kickRecoil();
    }
    let firePointer = null;
    function stopFiring() { firePointer = null; }
    function beginFiring(e) {
      if (e.button !== 0 || !playing() || firePointer !== null) return;
      e.preventDefault();
      firePointer = e.pointerId;
      if (e.currentTarget === fireButton) fireButton.setPointerCapture(e.pointerId);
      shoot();
    }
    renderer.domElement.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') beginFiring(e);
    });
    fireButton.addEventListener('pointerdown', beginFiring);
    for (const type of ['pointerup', 'pointercancel']) {
      window.addEventListener(type, e => {
        if (e.pointerId === firePointer) stopFiring();
      });
    }
    fireButton.addEventListener('lostpointercapture', stopFiring);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { stopFiring(); keys.clear(); }
    });


    const keys = new Set();
    let yaw = 0, pitch = 0, last = performance.now(), dragging = false, touchX = 0, touchY = 0;
    const overlay = document.querySelector('#overlay');
    const start = document.querySelector('#start');
    const isCoarse = matchMedia('(pointer: coarse)').matches;
    start.addEventListener('click', () => { overlay.style.display = 'none'; if (!isCoarse) renderer.domElement.requestPointerLock(); });
    document.addEventListener('pointerlockchange', () => { stopFiring(); keys.clear(); if (!isCoarse) overlay.style.display = document.pointerLockElement ? 'none' : 'grid'; });
    addEventListener('blur',()=>{stopFiring();keys.clear();dragging=false;});
    renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
    document.addEventListener('keydown', e => keys.add(e.code));
    document.addEventListener('keyup', e => keys.delete(e.code));
    document.addEventListener('mousemove', e => {
      if (document.pointerLockElement === renderer.domElement) look(e.movementX, e.movementY);
    });
    renderer.domElement.addEventListener('pointerdown', e => { if (isCoarse) { dragging = true; touchX = e.clientX; touchY = e.clientY; } });
    renderer.domElement.addEventListener('pointermove', e => { if (dragging) { look(e.clientX-touchX, e.clientY-touchY); touchX=e.clientX; touchY=e.clientY; } });
    renderer.domElement.addEventListener('pointerup', () => dragging = false);
    function look(dx, dy) { yaw -= dx * .0022; pitch -= dy * .0022; pitch = Math.max(-1.48, Math.min(1.48, pitch)); syncAim(); }

    document.querySelectorAll('[data-key]').forEach(btn => {
      const code = btn.dataset.key;
      btn.addEventListener('pointerdown', e => { e.preventDefault(); keys.add(code); });
      ['pointerup','pointercancel','pointerleave'].forEach(type => btn.addEventListener(type, () => keys.delete(code)));
    });

    function update(dt) {
      if (!playing()) return;
      const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 7.2 : 4.2) * dt;
      let forward = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
      let side = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
      if (forward || side) {
        const length = Math.hypot(forward, side); forward /= length; side /= length;
        const dx = (-Math.sin(yaw) * forward + Math.cos(yaw) * side) * speed;
        const dz = (-Math.cos(yaw) * forward - Math.sin(yaw) * side) * speed;
        const limit = roomHalf - wallThickness - .45;
        camera.position.x = THREE.MathUtils.clamp(camera.position.x + dx, -limit, limit);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z + dz, -limit, limit);
      }
      camera.position.y = PLAYER_EYE_HEIGHT;
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now-last)/1000, .05); last = now; update(dt);
      settleRecoil(dt, now);
      if (!playing()) stopFiring();
      else if (firePointer !== null) shoot();
      muzzle.visible = now-lastShot<65;
      blaster.position.z += (-.65-blaster.position.z)*Math.min(1,dt*18);
      if(now>effectUntil) hitLabel.textContent='';
      for(const dummy of dummies) {
        if(dummy.respawn && now>=dummy.respawn) {dummy.hp=3;dummy.respawn=0;dummy.group.visible=true;dummy.bar.scale.x=1;}
        for(const part of dummy.parts) part.material.emissive.setHex(now<dummy.flash?0x887722:0x000000);
      }
      for(let i=beams.length-1;i>=0;i--) if(now>=beams[i].until) {const {beam}=beams[i];scene.remove(beam);beam.geometry.dispose();beam.material.dispose();beams.splice(i,1);}
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
    addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  </script>
</body>
</html>
